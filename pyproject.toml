[project]
name = "kraken-crypto-market-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "apache-airflow>=3.3.1",
    "asyncpg>=0.31.0",
    "dotenv>=0.9.9",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pyspark>=4.2.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
]

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ingestion", "config", "streaming", "processing"]

[tool.setuptools]
py-modules = ["config"]
